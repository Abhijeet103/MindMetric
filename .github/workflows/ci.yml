name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Django quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_SETTINGS_MODULE: backend.config.test_settings
      PIP_AUDIT_CACHE_DIR: ${{ runner.temp }}/pip-audit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install coverage==7.10.6 ruff==0.12.8 pip-audit==2.9.0

      - name: Check code style and imports
        run: ruff check backend prepgia scripts

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: coverage run manage.py test

      - name: Enforce coverage baseline
        run: |
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Audit declared Python dependencies
        run: pip-audit -r requirements.txt --cache-dir "$PIP_AUDIT_CACHE_DIR"
