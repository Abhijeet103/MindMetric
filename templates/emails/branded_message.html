<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background-color:#f4f2ec;color:#233d34;font-family:Arial,Helvetica,sans-serif;">
