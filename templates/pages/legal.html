{% extends "base.html" %}

{% block content %}
<article class="legal">
    <header>
        <span class="eyebrow">Effective {{ page.effective_date|date:"j F Y" }}</span>
        <h1>{{ page.title }}</h1>
    </header>
    {% for block in blocks %}
        {% if block.kind == "heading" %}<h2>{{ block.text }}</h2>{% else %}<p>{{ block.text|linebreaksbr }}</p>{% endif %}
    {% endfor %}
</article>
{% endblock %}
