{% extends "base.html" %}

{% block content %}
<section class="content-section">
    <div class="login-layout">
        <article class="card login-panel">
            <span class="eyebrow">Password reset</span>
            <h1 class="section-title">Check your email</h1>
            <p class="section-copy">If an account uses that address, we've sent a link to reset your password. It can take a few minutes, so check your spam folder too.</p>
            <p class="login-switch">Still nothing? Email <a href="mailto:support@mindmetric.store">support@mindmetric.store</a></p>
        </article>
    </div>
</section>
{% endblock %}
