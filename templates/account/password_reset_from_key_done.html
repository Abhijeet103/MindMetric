{% extends "base.html" %}

{% block content %}
<section class="content-section">
    <div class="login-layout">
        <article class="card login-panel">
            <span class="eyebrow">Password reset</span>
            <h1 class="section-title">Password changed</h1>
            <p class="section-copy">You can now sign in with your new password.</p>
            <a class="button login-submit" href="{% url 'account_login' %}">Sign in</a>
        </article>
    </div>
</section>
{% endblock %}
