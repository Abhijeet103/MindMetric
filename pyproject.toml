[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles", "backend/**/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["backend", "prepgia"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "backend/config/asgi.py",
  "backend/config/wsgi.py",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_empty = true
